<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>金鶯診所 班表系統</title>
<style>
:root{
  --green:#5d8a6b;
  --green-d:#4a7058;
  --green-l:#e6efe9;
  --brown:#9b7e5a;
  --brown-d:#7a6244;
  --brown-l:#f3ede1;
  --bg:#f6f8f6;
  --line:#d9e1dc;
  --text:#2b3a31;
  --muted:#7a8a80;
  --warn:#c0392b;
  --warn-bg:#fdecea;
  --tag:#e8ddc4;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  /* 主題色（預設：健保=綠）*/
  --theme:var(--green);
  --theme-d:var(--green-d);
  --theme-l:var(--green-l);
  --theme-bg-from:#ffffff;
  --theme-bg-to:#eaf2ec;
  --theme-border:#d6e2da;
  --theme-cell-border:#e3ece5;
  --theme-divider:#d6e0da;
  /* 角落渲染色（明顯一點才看得出主題感）*/
  --theme-glow:rgba(93,138,107,.42);          /* 健保=綠 #5d8a6b @42% */
  --theme-glow-soft:rgba(93,138,107,.22);
}
/* 減重門診 = 咖啡色系 */
body.theme-減重門診{
  --theme:#9b7e5a;
  --theme-d:#7a6244;
  --theme-l:#f3ede1;
  --theme-bg-from:#fdfaf3;
  --theme-bg-to:#f0e7d6;
  --theme-border:#d6c8a8;
  --theme-cell-border:#ebe3d2;
  --theme-divider:#d8cdb5;
  /* 角落渲染色（咖啡色帶透明）*/
  --theme-glow:rgba(155,126,90,.42);           /* 咖啡 #9b7e5a @42% */
  --theme-glow-soft:rgba(155,126,90,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:14px;line-height:1.45;}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* Header */
header{background:var(--green);color:#fff;padding:10px 14px;display:flex;align-items:center;
  flex-wrap:wrap;gap:10px;box-shadow:var(--shadow);}
header h1{font-size:18px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
header h1 .logo{display:inline-flex;width:32px;height:32px;border-radius:50%;background:#fff;
  align-items:center;justify-content:center;color:var(--green);font-weight:700;overflow:hidden;flex-shrink:0;}
header h1 .logo img{width:100%;height:100%;object-fit:cover;display:block}
/* logo.png 載入失敗時的後備：顯示「鶯」字 */
header h1 .logo.logo-fallback::before{content:'鶯';font-size:16px}
header .grow{flex:1}
header select,header button{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);color:#fff}
header select{min-width:120px;font-weight:500}
header select option{color:#000;background:#fff}
header .who{font-size:13px;opacity:.95}

/* Tabs */
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{background:transparent;border:none;padding:11px 14px;border-bottom:2px solid transparent;
  color:var(--muted);font-weight:500}
.tabs button.active{color:var(--green-d);border-bottom-color:var(--green)}

/* Service type switcher (健保 / 減重) */
.svc-tabs{display:flex;gap:0;padding:8px 14px 0 14px;background:#fff;border-bottom:1px solid var(--line)}
.svc-tabs button{background:transparent;border:1px solid var(--line);border-bottom:none;
  padding:8px 18px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:500;cursor:pointer;
  margin-right:4px;font-size:14px;letter-spacing:1px}
.svc-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.svc-tabs button:hover:not(.active){background:var(--green-l);color:var(--green-d)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1}
.toolbar .btn{padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text)}
.toolbar .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.toolbar .btn.warn{background:#fff;color:var(--warn);border-color:#e9bdb6}
.toolbar .btn:hover{filter:brightness(.97)}
.toolbar .pill{padding:5px 10px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-size:12px}

/* Schedule grid */
.schedule-wrap{padding:14px}
.print-frame{
  /* 雙角落主題色渲染：右上強、左下柔 */
  background:
    radial-gradient(ellipse 78% 58% at 108% -8%,  var(--theme-glow)      0%, transparent 65%),
    radial-gradient(ellipse 65% 50% at -8% 108%,  var(--theme-glow-soft) 0%, transparent 65%),
    var(--theme-bg-from);
  border-radius:14px;padding:22px 24px 26px 24px;box-shadow:var(--shadow);border:1px solid var(--theme-border);
  transition:background .3s, border-color .3s;
}
.print-head{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.print-head .brand{display:flex;align-items:center;gap:10px}
.print-head .brand-logo{width:64px;height:64px;border-radius:50%;background:#f5f8f3;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--theme-border);
  overflow:hidden;flex-shrink:0;transition:border-color .3s;}
.print-head .brand-logo svg{width:42px;height:42px}
.print-head .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.print-head .brand-name{font-size:22px;font-weight:600;color:var(--theme-d);letter-spacing:2px;transition:color .3s}
.print-head .title-wrap{flex:1;display:flex;justify-content:center;align-items:center}
.print-head .title-text{font-size:26px;font-weight:600;color:#2b3a31;letter-spacing:3px;text-align:center;
  padding:4px 8px;border:1px dashed transparent;border-radius:6px;min-width:200px}
.print-head .title-text:focus{outline:none;border-color:var(--green);background:#fff}
.schedule{background:transparent;border:none;border-radius:0;overflow:visible;
  display:grid;grid-template-columns:72px repeat(7,1fr);box-shadow:none;gap:6px;}
.schedule .corner{background:transparent;}
.schedule .head{background:var(--theme);color:#fff;padding:12px 6px;text-align:center;font-weight:600;
  letter-spacing:6px;font-size:16px;border-radius:2px;transition:background .3s;}
.schedule .session-label{background:transparent;color:var(--theme-d);font-weight:600;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;letter-spacing:8px;font-size:22px;transition:color .3s;}
.schedule .cell{background:rgba(255,255,255,.85);border:1px solid var(--theme-cell-border);border-radius:2px;
  min-height:130px;padding:8px 4px;display:flex;gap:4px;flex-wrap:wrap;align-content:flex-start;justify-content:center;
  transition:border-color .3s;}

.slot{flex:1 1 calc(50% - 4px);min-width:0;background:transparent;border:none;border-radius:0;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  font-size:14px;cursor:pointer;transition:background .15s;border-right:1px dashed var(--theme-divider);}
.slot:last-child{border-right:none}
.slot:only-child{flex-basis:100%;border-right:none}
.slot .name{font-weight:600;color:var(--text);font-size:18px;letter-spacing:2px;line-height:1.2;margin-bottom:2px}
.slot .time-block{display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--theme-d);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.slot .tilde{color:var(--muted);font-size:14px;line-height:1}
/* 休診（沒有任何排班的格子）*/
.cell-empty{color:var(--muted);font-size:18px;letter-spacing:4px;display:flex;align-items:center;justify-content:center;width:100%;font-weight:500}
.slot.exc-leave{background:#fff4f1;border-color:#f1c2b9}
.slot.exc-sub{background:#fff8e1;border-color:#e6d49a}
.slot.exc-cancel{background:#f0f0f0;border-color:#d0d0d0;text-decoration:line-through;color:var(--muted)}
.slot .tag{display:inline-block;padding:1px 6px;border-radius:999px;background:var(--tag);color:#7a5d2a;font-size:11px;margin-top:2px}

.slot.editable:hover{background:var(--green-l)}
.add-btn{flex:1 1 100%;border:1px dashed var(--line);background:transparent;color:var(--muted);
  border-radius:6px;padding:6px;font-size:12px}
.add-btn:hover{border-color:var(--green);color:var(--green-d)}

/* Exception page */
.list{padding:14px}
.list .row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;
  align-items:center;margin-bottom:8px;box-shadow:var(--shadow);}
.list .row .date{font-weight:600;min-width:90px}
.list .row .session{padding:2px 8px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-size:12px}
.list .row .type-請假{background:#fdecea;color:var(--warn)}
.list .row .type-代班{background:#fff4d6;color:#8c6d1f}
.list .row .type-取消{background:#eee;color:#666}
.list .row .type-加診{background:var(--green-l);color:var(--green-d)}
.list .row .body{flex:1}
.list .row .actions{display:flex;gap:6px}
.list .row .actions .btn{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:#fff}

/* Hours report */
.hours-card{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
  box-shadow:var(--shadow);overflow:hidden}
.hours-card .head{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;background:#fafdfb}
.hours-card .head:hover{background:var(--green-l)}
.hours-card .head .doc{font-size:16px;font-weight:600;color:var(--text);min-width:90px}
.hours-card .head .stat{font-size:13px;color:var(--muted)}
.hours-card .head .total{margin-left:auto;font-size:18px;font-weight:600;color:var(--green-d)}
.hours-card .head .total small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.hours-card .head .arrow{color:var(--muted);transition:transform .2s}
.hours-card.open .head .arrow{transform:rotate(90deg)}
.hours-card .detail{display:none;padding:0;border-top:1px solid var(--line)}
.hours-card.open .detail{display:block}
.hours-card .detail table{width:100%;border-collapse:collapse;font-size:13px}
.hours-card .detail th,.hours-card .detail td{padding:6px 10px;text-align:left;border-bottom:1px solid #f0f3f0}
.hours-card .detail th{background:#f6f8f6;color:var(--muted);font-weight:500}
.hours-card .detail tr:last-child td{border-bottom:none}
.hours-summary-pill{background:var(--green-l);color:var(--green-d);border-radius:8px;padding:10px 14px;
  display:flex;gap:18px;align-items:center;font-size:14px;flex-wrap:wrap}

/* History page */
.hist-row{font-size:13px;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line);}
.hist-row .time{color:var(--muted);margin-right:8px}
.hist-row .op{font-weight:600;margin-right:6px}
.hist-row .pre,.hist-row .post{font-family:ui-monospace,monospace;background:#fafafa;padding:2px 4px;border-radius:3px;color:#444}

/* Modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:10px;width:480px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.modal .body label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.modal .body label input,.modal .body label select,.modal .body label textarea{
  padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--text);background:#fff;font-size:14px;width:100%}
.modal .body .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal .foot .btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--text)}
.modal .foot .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.modal .foot .btn.warn{background:#fff;color:var(--warn);border-color:#e9bdb6;margin-right:auto}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;
  padding:10px 16px;border-radius:6px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:.95}
.toast.err{background:var(--warn)}
.toast.ok{background:var(--green-d)}

/* Responsive */
@media (max-width:760px){
  header h1{font-size:16px}
  .schedule{grid-template-columns:50px repeat(7,minmax(70px,1fr));overflow:auto}
  .schedule-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .schedule .cell{min-height:90px}
  .slot{font-size:12px;padding:4px 2px}
  .slot .time{font-size:11px}
  .toolbar{padding:8px 10px}
  .schedule .session-label{letter-spacing:4px;font-size:18px}
}

.hide{display:none !important}

/* 匯出時的版面（隱藏編輯互動元素，標題去掉框線、固定 A4 橫式比例）*/
body.exporting .add-btn{display:none !important}
body.exporting .print-head .title-text{border-color:transparent !important;background:transparent !important}
body.exporting .slot{cursor:default !important}
/* A4 橫式 = 297:210 ≈ 1.414:1。寬 1240px → 高 ~877px。整體含 padding 與 head ~880-920px */
body.exporting .print-frame{
  width:1240px !important;
  min-height:880px !important;
  padding:28px 32px 32px 32px !important;
  box-sizing:border-box !important;
  display:flex !important;
  flex-direction:column !important;
}
body.exporting .print-frame > .schedule{ flex:1 1 auto; }
body.exporting .schedule .head{ font-size:20px; padding:16px 6px; letter-spacing:8px; }
body.exporting .schedule .session-label{ font-size:26px; letter-spacing:10px; }
body.exporting .schedule .cell{ min-height:0; }   /* 由 flex 撐開 */
body.exporting .slot .name{ font-size:20px; }
body.exporting .slot .time-block{ font-size:20px; }
body.exporting .print-head .brand-name{ font-size:26px; }
body.exporting .print-head .title-text{ font-size:30px; }
</style>
</head>
<body>

<header>
  <h1>
    <span class="logo">
      <img src="logo.png" alt="金鶯" onerror="this.style.display='none';this.parentNode.classList.add('logo-fallback');">
    </span>
    金鶯診所 班表系統
  </h1>
  <div class="grow"></div>
  <select id="clinic-sel" title="院區"></select>
  <span class="who" id="who">未登入</span>
  <button id="btn-login" type="button">登入</button>
  <button id="btn-logout" type="button" class="hide">登出</button>
</header>

<nav class="tabs">
  <button data-tab="schedule" class="active" type="button">班表</button>
  <button data-tab="hours" type="button">工時報表</button>
  <button data-tab="exceptions" type="button">例外記錄</button>
  <button data-tab="history" type="button">修改歷史</button>
</nav>

<!-- 班表頁 -->
<section id="page-schedule">
  <div class="svc-tabs" id="svc-tabs"><!-- 門診類型 sub-tabs --></div>
  <div class="toolbar">
    <span class="pill" id="schedule-info">本週班表 — 鶯歌院區</span>
    <span class="pill" id="exc-count" style="background:#fff4e0;color:#8c6d1f;display:none"></span>
    <div class="grow"></div>
    <button class="btn" id="btn-prev-week" type="button" title="上一週">←&nbsp;上週</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">
      <input type="date" id="ref-date" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">
    </label>
    <button class="btn" id="btn-next-week" type="button" title="下一週">下週&nbsp;→</button>
    <button class="btn" id="btn-this-week" type="button" title="跳回本週">本週</button>
    <button class="btn" id="btn-refresh" type="button">重新整理</button>
    <button class="btn" id="btn-export-png" type="button">匯出 PNG</button>
    <button class="btn" id="btn-export-pdf" type="button">匯出 PDF</button>
    <button class="btn hide" id="btn-apply-tpl" type="button">套用週範本到月份</button>
    <button class="btn hide" id="btn-publish" type="button" style="background:var(--green);color:#fff;border-color:var(--green)">發布（本月）</button>
    <button class="btn warn hide" id="btn-clear-month" type="button">一鍵清空（本月）</button>
    <button class="btn primary hide" id="btn-edit-mode" type="button">進入編輯模式</button>
  </div>
  <div class="schedule-wrap">
    <div class="print-frame" id="print-frame">
      <div class="print-head">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <img src="logo.png" alt="金鶯診所" crossorigin="anonymous"
                 onerror="this.outerHTML='<svg viewBox=&quot;0 0 64 64&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;><g fill=&quot;#5d8a6b&quot;><path d=&quot;M14 38c0-8 6-14 14-14 6 0 11 4 13 9 1 2 3 4 5 4l4 1c1 0 1 1 0 2-3 3-9 6-15 6-3 0-6-1-8-2-2 4-7 6-12 6-2 0-3-1-3-3 0-2 1-4 2-5 0-1 0-2 0-4z&quot;/><circle cx=&quot;42&quot; cy=&quot;32&quot; r=&quot;2&quot; fill=&quot;#fff&quot;/><path d=&quot;M44 21c2-4 6-7 11-8 1 0 2 1 1 2-2 4-5 7-9 9-2 1-3 0-3-3z&quot;/></g></svg>'">
          </div>
          <div class="brand-name">金鶯診所</div>
        </div>
        <div class="title-wrap">
          <div class="title-text" id="print-title" contenteditable="true" spellcheck="false">鶯歌健保門診</div>
        </div>
      </div>
      <div class="schedule" id="schedule-grid"><!-- generated --></div>
    </div>
  </div>
</section>

<!-- 工時報表頁 -->
<section id="page-hours" class="hide">
  <div class="toolbar">
    <span class="pill">薪資工時計算</span>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">
      院區
      <select id="hours-clinic" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;min-width:120px">
        <option value="all">全部院區</option>
      </select>
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">
      門診類型
      <select id="hours-service" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">
        <option value="">全部合併</option>
        <option value="健保門診">健保門診</option>
        <option value="減重門診">減重門診</option>
      </select>
    </label>
    <div class="grow"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">
      期間 <input type="date" id="hours-from" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">
      ~ <input type="date" id="hours-to" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px">
    </label>
    <button class="btn" id="btn-hours-this-month" type="button">本月</button>
    <button class="btn" id="btn-hours-last-month" type="button">上月</button>
    <button class="btn primary" id="btn-hours-load" type="button">查詢</button>
    <button class="btn" id="btn-hours-csv" type="button">匯出 CSV</button>
  </div>
  <div class="list" id="hours-summary" style="padding:14px 14px 0 14px"></div>
  <div class="list" id="hours-table"></div>
</section>

<!-- 例外記錄頁 -->
<section id="page-exceptions" class="hide">
  <div class="toolbar">
    <span class="pill">請假 / 代班 / 取消 / 加診</span>
    <div class="grow"></div>
    <button class="btn primary hide" id="btn-add-exc" type="button">新增例外</button>
  </div>
  <div class="list" id="exc-list"></div>
</section>

<!-- 歷史頁 -->
<section id="page-history" class="hide">
  <div class="toolbar">
    <span class="pill">最近 200 筆變更</span>
    <div class="grow"></div>
    <button class="btn" id="btn-history-refresh" type="button">重新整理</button>
  </div>
  <div id="hist-list"></div>
</section>

<!-- 登入 Modal -->
<div class="mask" id="mask-login">
  <div class="modal">
    <h2>登入</h2>
    <div class="body">
      <label>帳號 <input id="login-user" type="text" autocomplete="username"></label>
      <label>密碼 <input id="login-pass" type="password" autocomplete="current-password"></label>
    </div>
    <div class="foot">
      <button class="btn" type="button" data-close="mask-login">取消</button>
      <button class="btn primary" type="button" id="btn-do-login">登入</button>
    </div>
  </div>
</div>

<!-- 排班編輯 Modal -->
<div class="mask" id="mask-slot">
  <div class="modal">
    <h2 id="slot-title">新增排班</h2>
    <div class="body">
      <div class="row2">
        <label>日期 <input id="slot-date" type="date" required></label>
        <label>時段
          <select id="slot-session"><option>早診</option><option>午診</option><option>晚診</option></select>
        </label>
      </div>
      <label>門診類型
        <select id="slot-service">
          <option value="健保門診">健保門診</option>
          <option value="減重門診">減重門診</option>
        </select>
      </label>
      <label>醫師
        <select id="slot-doctor"></select>
      </label>
      <div class="row2">
        <label>起始時間 <input id="slot-start" type="time" required></label>
        <label>結束時間 <input id="slot-end"   type="time" required></label>
      </div>
      <div class="row2">
        <label>顯示順序 <input id="slot-sort" type="number" min="1" value="1"></label>
        <label>備註 <input id="slot-note" type="text" placeholder="（選填）"></label>
      </div>
      <div id="slot-hours-info" style="font-size:13px;color:var(--muted);text-align:right">時數：—</div>
    </div>
    <div class="foot">
      <button class="btn warn hide" type="button" id="btn-slot-del">刪除</button>
      <button class="btn" type="button" data-close="mask-slot">取消</button>
      <button class="btn primary" type="button" id="btn-slot-save">儲存</button>
    </div>
  </div>
</div>

<!-- 套用週範本 Modal -->
<div class="mask" id="mask-apply">
  <div class="modal">
    <h2>套用週範本到月份</h2>
    <div class="body">
      <p style="margin:0;color:var(--muted);font-size:13px">
        會把「週範本」依星期展開到所選月份的每一天，並寫入「排班記錄」。<br>
        日後針對特定日期的調整（請假、代班、增減時段）可以直接修改該天的排班，不會影響範本。
      </p>
      <label>目標月份 <input id="apply-month" type="month" required></label>
      <label>套用模式
        <select id="apply-mode">
          <option value="smart">智能補齊（保留修改，只補空缺）— 推薦</option>
          <option value="append">附加（保留現有，但同醫師會跳過避免重複）</option>
          <option value="replace">完全覆蓋（先全部停用該月再寫入）— 砍掉重練</option>
        </select>
      </label>
    </div>
    <div class="foot">
      <button class="btn" type="button" data-close="mask-apply">取消</button>
      <button class="btn primary" type="button" id="btn-do-apply">套用</button>
    </div>
  </div>
</div>

<!-- 匯出依賴：html2canvas + jsPDF（使用版本固定避免破壞性變更）-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* ===================== 設定 ===================== */
// Apps Script Web App 網址
var API = 'https://script.google.com/macros/s/AKfycbxCI-WT385nZMkrnWrEJdDibS7O0DZw30vpmhF_lCAvbHpbG_JVT7Jl9YoS6bcQ-pjdng/exec';

/* ===================== 狀態 ===================== */
var STATE = {
  user: null,            // {name, role, clinic}
  clinic: 'yingge',
  clinics: [],
  service: '健保門診',     // 門診類型：健保門診 / 減重門診
  services: ['健保門診', '減重門診'],
  doctors: [],
  schedule: [],          // 排班記錄（按日期）
  exceptions: [],        // 例外記錄
  refDate: '',           // YYYY-MM-DD（影響顯示的「本週」）
  weekDates: [],         // 本週 7 天的日期
  hoursReport: null,     // 工時報表暫存
  editMode: false
};
var EDIT_SLOT = null;    // 目前編輯中的 slot 物件
var EDIT_EXC = null;     // 目前編輯中的 exception 物件
var SESSIONS = ['早診','午診','晚診'];
var WEEK = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];

/* ===================== 共用 ===================== */
function $(id){ return document.getElementById(id); }
function show(el){
  if(typeof el==='string') el=$(el);
  if (!el) return;
  el.classList.remove('hide');
  if (el.classList.contains('mask')) el.classList.add('show'); // mask 用 .show 控制
}
function hide(el){
  if(typeof el==='string') el=$(el);
  if (!el) return;
  if (el.classList.contains('mask')) { el.classList.remove('show'); return; }
  el.classList.add('hide');
}
function toast(msg, type){
  var t=$('toast'); t.textContent=msg; t.className='toast show '+(type||'');
  setTimeout(function(){ t.className='toast '+(type||''); }, 2400);
}
function get(params, cb){
  // 預先檢查 API 設定
  if (!API || API.indexOf('PUT_YOUR_APPS_SCRIPT_URL') >= 0){
    var msg = '⚠️ 請先在 index.html 第 56 行附近把 var API 換成您部署的 Apps Script /exec 網址';
    toast(msg, 'err'); cb({error: msg}); return;
  }
  if (API.indexOf('/exec') < 0){
    var msg2 = '⚠️ API 網址必須以 /exec 結尾（不是 /dev）';
    toast(msg2, 'err'); cb({error: msg2}); return;
  }
  var q = Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]==null?'':params[k]);
  }).join('&');
  fetch(API+'?'+q)
    .then(function(r){ return r.text().then(function(t){ return {status:r.status, text:t}; }); })
    .then(function(res){
      var t = res.text || '';
      // 如果回傳是 HTML（不是 JSON），給出具體建議
      if (t.charAt(0) === '<' || t.indexOf('<!DOCTYPE') >= 0 || t.indexOf('<html') >= 0){
        var hint;
        if (t.indexOf('accounts.google.com') >= 0 || t.indexOf('ServiceLogin') >= 0){
          hint = 'Apps Script 部署的「有權存取的人」要設為「任何人」。\n\n修法：\n部署 → 管理部署 → 鉛筆 → 「有權存取的人」→ 任何人 → 部署';
        } else if (t.indexOf('Authorization') >= 0 || t.indexOf('授權') >= 0){
          hint = 'Apps Script 尚未授權存取 Sheets。\n\n修法：在編輯器內直接執行一次 setup 或 validateConfig 來觸發授權，然後重新部署';
        } else {
          hint = 'API 網址可能錯誤，或 Apps Script 部署有問題。\n\n請：\n1. 把 API 網址貼到瀏覽器，後面加 ?action=ping，應該看到 {"ok":true,...}\n2. 若看到登入頁 → 部署權限不對\n3. 若看到錯誤頁 → 部署網址錯誤';
        }
        toast('API 回傳了 HTML 不是 JSON', 'err');
        console.error('=== API 錯誤 ===\n', hint, '\n\nAPI URL:', API, '\n\n回傳內容前 500 字:\n', t.slice(0, 500));
        cb({error:'API 回傳 HTML：請按 F12 看 Console 檢視診斷'});
        return;
      }
      try { cb(JSON.parse(t)); }
      catch (e) { toast('回傳格式錯誤：'+e.message, 'err'); cb({error:String(e)}); }
    })
    .catch(function(e){ toast('連線失敗：'+e, 'err'); cb({error:String(e)}); });
}
function todayStr(){
  var d=new Date();
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}
// 給定 YYYY-MM-DD，回傳該週的 [週一..週日] 七個 YYYY-MM-DD
function weekRange(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  if (isNaN(d.getTime())) d = new Date();
  var w = d.getDay(); w = w===0 ? 7 : w; // 1..7 (Mon..Sun)
  var mon = new Date(d); mon.setDate(d.getDate() - (w-1));
  var arr = [];
  for (var i=0;i<7;i++){
    var x = new Date(mon); x.setDate(mon.getDate()+i);
    var y=x.getFullYear(), m=String(x.getMonth()+1).padStart(2,'0'), dd=String(x.getDate()).padStart(2,'0');
    arr.push(y+'-'+m+'-'+dd);
  }
  return arr;
}

/* ===================== 初始化 ===================== */
function init(){
  // 還原登入狀態
  try{
    var u = JSON.parse(localStorage.getItem('schedule_user')||'null');
    if (u && u.name) STATE.user = u;
  }catch(e){}
  applyAuthUI();

  // 預設 refDate = 今天
  STATE.refDate = todayStr();
  $('ref-date').value = STATE.refDate;

  // 綁定事件
  bindEvents();
  bindTitlePersist();

  // 載入 init 資料
  loadInit();
}

function bindEvents(){
  // tab 切換
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
  });
  // 院區切換
  $('clinic-sel').addEventListener('change', function(){
    STATE.clinic = this.value;
    try { localStorage.setItem('schedule_clinic', this.value); } catch(e){}
    refreshTitle();
    loadAll();
  });
  // 參考日期 — 換週要重新撈資料
  $('ref-date').addEventListener('change', function(){
    STATE.refDate = this.value || todayStr();
    loadAll();
  });
  // 上/下/本週 切換
  $('btn-prev-week').addEventListener('click', function(){ gotoWeek(-1); });
  $('btn-next-week').addEventListener('click', function(){ gotoWeek( 1); });
  $('btn-this-week').addEventListener('click', function(){
    STATE.refDate = todayStr();
    $('ref-date').value = STATE.refDate;
    loadAll();
  });
  // 編輯模式
  $('btn-edit-mode').addEventListener('click', toggleEditMode);
  // 重新整理
  $('btn-refresh').addEventListener('click', function(){ loadAll(); toast('已重新載入','ok'); });
  $('btn-history-refresh').addEventListener('click', loadHistory);
  // 匯出
  $('btn-export-png').addEventListener('click', exportPNG);
  $('btn-export-pdf').addEventListener('click', exportPDF);
  // 登入登出
  $('btn-login').addEventListener('click', function(){ $('login-user').value=''; $('login-pass').value=''; show('mask-login'); $('login-user').focus(); });
  $('btn-logout').addEventListener('click', doLogout);
  $('btn-do-login').addEventListener('click', doLogin);
  $('login-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  // 例外新增
  $('btn-add-exc').addEventListener('click', function(){ openExcModal(null); });
  // 套用週範本 / 發布 / 一鍵清空
  $('btn-apply-tpl').addEventListener('click', openApplyModal);
  $('btn-do-apply').addEventListener('click', doApplyTemplate);
  $('btn-publish').addEventListener('click', quickPublish);
  $('btn-clear-month').addEventListener('click', quickClearMonth);
  // 工時報表
  $('btn-hours-load').addEventListener('click', loadHours);
  $('btn-hours-this-month').addEventListener('click', function(){ setHoursDateRange('this'); loadHours(); });
  $('btn-hours-last-month').addEventListener('click', function(){ setHoursDateRange('last'); loadHours(); });
  $('btn-hours-csv').addEventListener('click', exportHoursCSV);
  $('hours-service').addEventListener('change', function(){
    if ($('hours-from').value && $('hours-to').value) loadHours();
  });
  $('hours-clinic').addEventListener('change', function(){
    if ($('hours-from').value && $('hours-to').value) loadHours();
  });
  // Slot 起訖時間變動 → 即時計算時數
  ['slot-start','slot-end'].forEach(function(id){
    $(id).addEventListener('input', updateSlotHoursInfo);
  });
  // Modal close
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', function(){ hide(b.dataset.close); });
  });
  // 點 mask 背景關閉
  document.querySelectorAll('.mask').forEach(function(m){
    m.addEventListener('click', function(e){ if(e.target===m) hide(m); });
  });
  // Slot Modal 動作
  $('btn-slot-save').addEventListener('click', saveSlot);
  $('btn-slot-del').addEventListener('click', deleteSlot);
  // Exc Modal 動作
  $('btn-exc-save').addEventListener('click', saveException);
  $('btn-exc-del').addEventListener('click', deleteException);
  // Type 切換顯示代班醫師欄位
  $('exc-type').addEventListener('change', updateExcSubVisibility);
}

function switchTab(tab){
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab===tab);
  });
  ['schedule','hours','exceptions','history'].forEach(function(t){ hide('page-'+t); });
  show('page-'+tab);
  if (tab==='exceptions') renderExceptions();
  if (tab==='history') loadHistory();
  if (tab==='hours' && (!$('hours-from').value || !$('hours-to').value)){
    setHoursDateRange('this');
    if (STATE.user) loadHours();
  }
}

/* ===================== 認證 ===================== */
function applyAuthUI(){
  if (STATE.user){
    $('who').textContent = STATE.user.name + ' · ' + (STATE.user.role==='admin'?'管理者':'員工');
    hide('btn-login'); show('btn-logout');
    if (STATE.user.role==='admin'){
      show('btn-edit-mode'); show('btn-add-exc'); show('btn-apply-tpl');
      show('btn-publish'); show('btn-clear-month');
    } else {
      hide('btn-edit-mode'); hide('btn-add-exc'); hide('btn-apply-tpl');
      hide('btn-publish'); hide('btn-clear-month');
    }
  } else {
    $('who').textContent = '未登入';
    show('btn-login'); hide('btn-logout');
    hide('btn-edit-mode'); hide('btn-add-exc'); hide('btn-apply-tpl');
    hide('btn-publish'); hide('btn-clear-month');
    STATE.editMode = false;
    document.body.classList.remove('edit-on');
  }
}

function doLogin(){
  var u=$('login-user').value.trim(), p=$('login-pass').value;
  if(!u || !p){ toast('請輸入帳號密碼','err'); return; }
  $('btn-do-login').disabled = true;
  get({action:'login', user:u, pass:p}, function(r){
    $('btn-do-login').disabled = false;
    if(r.error){ toast(r.error,'err'); return; }
    STATE.user = r.user;
    try{ localStorage.setItem('schedule_user', JSON.stringify(r.user)); }catch(e){}
    hide('mask-login'); applyAuthUI(); toast('登入成功','ok');
  });
}

function doLogout(){
  STATE.user = null;
  try{ localStorage.removeItem('schedule_user'); }catch(e){}
  applyAuthUI(); toast('已登出','ok');
  renderSchedule();
}

function toggleEditMode(){
  if (!STATE.user || STATE.user.role!=='admin'){ toast('需要管理者登入','err'); return; }
  STATE.editMode = !STATE.editMode;
  $('btn-edit-mode').textContent = STATE.editMode ? '結束編輯' : '進入編輯模式';
  $('btn-edit-mode').classList.toggle('warn', STATE.editMode);
  document.body.classList.toggle('edit-on', STATE.editMode);
  renderSchedule();
}

/* ===================== 載入 ===================== */
function loadInit(){
  get({action:'getInit'}, function(r){
    if (r.error){ toast('載入失敗：'+r.error,'err'); return; }
    STATE.clinics = r.clinics || [];
    STATE.doctors = r.doctors || [];
    STATE.services = r.services || ['健保門診', '減重門診'];
    if (r.defaultService) STATE.service = r.defaultService;
    // 還原上次選的門診類型
    try {
      var lastSvc = localStorage.getItem('schedule_service');
      if (lastSvc && STATE.services.indexOf(lastSvc) >= 0) STATE.service = lastSvc;
    } catch(e){}
    // 院區下拉
    var sel = $('clinic-sel'); sel.innerHTML = '';
    STATE.clinics.forEach(function(c){
      var o=document.createElement('option'); o.value=c.code; o.textContent=c.name; sel.appendChild(o);
    });
    if (STATE.clinics.length){
      // 還原上次選的院區
      var lastClinic = '';
      try { lastClinic = localStorage.getItem('schedule_clinic') || ''; } catch(e){}
      var validClinic = STATE.clinics.find(function(c){ return c.code === lastClinic; });
      STATE.clinic = validClinic ? lastClinic : STATE.clinics[0].code;
      sel.value = STATE.clinic;
    }
    fillDoctorSelects();
    applyTheme();
    renderServiceTabs();
    refreshTitle();
    fillHoursClinicSel();
    loadAll();
  });
}

/* 門診類型切換 Tabs */
function renderServiceTabs(){
  var box = $('svc-tabs'); if (!box) return;
  box.innerHTML = '';
  STATE.services.forEach(function(svc){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = svc;
    b.className = (svc === STATE.service) ? 'active' : '';
    b.addEventListener('click', function(){
      if (STATE.service === svc) return;
      STATE.service = svc;
      try { localStorage.setItem('schedule_service', svc); } catch(e){}
      applyTheme();
      renderServiceTabs();
      refreshTitle();
      loadAll();
    });
    box.appendChild(b);
  });
}

/* 套用主題色（健保=綠、減重=棕）*/
function applyTheme(){
  document.body.classList.remove('theme-健保門診', 'theme-減重門診');
  document.body.classList.add('theme-' + STATE.service);
}

/* 上/下一週切換 */
function gotoWeek(delta){
  var base = STATE.refDate || todayStr();
  var d = new Date(base + 'T00:00:00');
  if (isNaN(d.getTime())) d = new Date();
  d.setDate(d.getDate() + delta * 7);
  var pad = function(n){ return String(n).padStart(2,'0'); };
  STATE.refDate = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  $('ref-date').value = STATE.refDate;
  loadAll();
}

function fillDoctorSelects(){
  ['slot-doctor','exc-orig','exc-sub'].forEach(function(id){
    var sel=$(id); sel.innerHTML='';
    if (id!=='slot-doctor'){
      var blank=document.createElement('option'); blank.value=''; blank.textContent='— 不指定 —'; sel.appendChild(blank);
    }
    STATE.doctors.forEach(function(d){
      var o=document.createElement('option'); o.value=d; o.textContent=d; sel.appendChild(o);
    });
  });
  if (!STATE.doctors.length){
    toast('讀不到醫師名單，請確認員工資料庫設定', 'err');
  }
}

function loadAll(){
  loadSchedule();
  loadExceptions();
}

function loadSchedule(){
  var weekDates = weekRange(STATE.refDate || todayStr());
  var from = weekDates[0], to = weekDates[6];
  STATE.weekDates = weekDates;
  get({action:'getSchedule', clinic:STATE.clinic, service:STATE.service, from:from, to:to}, function(r){
    if (r.error){ toast('載入班表失敗：'+r.error,'err'); return; }
    STATE.schedule = r.rows || [];
    renderSchedule();
  });
}

function loadExceptions(){
  // 取近 60 天 ~ 未來 60 天範圍
  var d=new Date(); var pad=function(n){return String(n).padStart(2,'0')};
  var fr=new Date(d); fr.setDate(d.getDate()-60);
  var to=new Date(d); to.setDate(d.getDate()+60);
  var f=fr.getFullYear()+'-'+pad(fr.getMonth()+1)+'-'+pad(fr.getDate());
  var t=to.getFullYear()+'-'+pad(to.getMonth()+1)+'-'+pad(to.getDate());
  get({action:'getExceptions', clinic:STATE.clinic, from:f, to:t}, function(r){
    if (r.error){ toast('載入例外失敗：'+r.error,'err'); return; }
    STATE.exceptions = r.rows || [];
    renderExceptions();
    renderSchedule(); // 重畫以套用例外覆蓋
  });
}

/* ===================== 渲染：班表 ===================== */
function renderSchedule(){
  var grid=$('schedule-grid'); grid.innerHTML='';
  var hintBox = $('empty-hint'); if (hintBox) hintBox.remove();

  // 院區名稱顯示
  var cName = (STATE.clinics.find(function(c){return c.code===STATE.clinic;}) || {}).name
              || (STATE.clinic === 'yingge' ? '鶯歌院區' : STATE.clinic);
  $('schedule-info').textContent = '本週班表 — ' + cName + ' · ' + STATE.service;

  // 沒資料時顯示提示
  if (!STATE.schedule || !STATE.schedule.length){
    var hint = document.createElement('div');
    hint.id = 'empty-hint';
    hint.style.cssText = 'background:#fff8e1;border:1px solid #e6d49a;color:#8c6d1f;'
      + 'padding:14px 18px;border-radius:8px;margin-bottom:14px;font-size:14px;line-height:1.7';
    hint.innerHTML = '<b>📅 本週尚無排班記錄</b><br>'
      + '若是首次使用，請：<br>'
      + '1. 點右上「<b>登入</b>」（預設 Admin / 0000）<br>'
      + '2. 工具列會出現「<b>套用週範本到月份</b>」按鈕 → 點選後選月份 → 套用<br>'
      + '3. 整月每天的排班就會自動產生，回到此頁即可看到班表';
    var frame = document.querySelector('.print-frame');
    frame.parentNode.insertBefore(hint, frame);
  }

  // 計算本週的日期清單（依 refDate）
  var weekDates = weekRange(STATE.refDate || todayStr());

  // 表頭
  var corner=document.createElement('div'); corner.className='corner'; corner.textContent=''; grid.appendChild(corner);
  for (var i=0;i<7;i++){
    var h=document.createElement('div'); h.className='head';
    h.innerHTML = WEEK[i] + '<div style="font-size:12px;font-weight:400;opacity:.85;margin-top:2px">'+weekDates[i].slice(5)+'</div>';
    grid.appendChild(h);
  }

  // 整理 exception 為 map: key=date|session => [exc]
  var excMap = {};
  STATE.exceptions.forEach(function(e){
    var key = e.date+'|'+e.session;
    (excMap[key] = excMap[key] || []).push(e);
  });
  // 統計本週例外數
  var weekExc = 0;
  STATE.exceptions.forEach(function(e){ if (weekDates.indexOf(e.date)>=0) weekExc++; });
  var pill=$('exc-count');
  if (weekExc>0){ pill.textContent = '本週例外 '+weekExc+' 筆'; pill.style.display=''; }
  else { pill.style.display='none'; }

  // 每個時段 row
  for (var s=0; s<SESSIONS.length; s++){
    var session = SESSIONS[s];
    var rowLast = (s===SESSIONS.length-1) ? ' row-last' : '';
    var lab=document.createElement('div'); lab.className='session-label'+rowLast; lab.textContent=session; grid.appendChild(lab);

    for (var w=1; w<=7; w++){
      var cell=document.createElement('div'); cell.className='cell'+rowLast;
      var dateStr = weekDates[w-1];

      // 該格子的 base slots（按日期 + 時段）
      var items = STATE.schedule.filter(function(r){
        return r.date===dateStr && r.session===session;
      }).sort(function(a,b){ return (a.sort||0)-(b.sort||0); });

      // 套用例外標記
      var excHere = excMap[dateStr+'|'+session] || [];
      // map orig doctor -> exception
      var excByDoctor = {};
      excHere.forEach(function(e){ if(e.origDoctor) excByDoctor[e.origDoctor]=e; });
      // 加診類型直接以新項目顯示
      var addItems = excHere.filter(function(e){ return e.type==='加診'; });

      items.forEach(function(it){
        var node = makeSlot(it, excByDoctor[it.doctor]);
        cell.appendChild(node);
      });
      addItems.forEach(function(e){
        var node = makeExcOnlySlot(e);
        cell.appendChild(node);
      });

      // 沒有任何排班 → 顯示「休診」（非編輯模式才顯示）
      if (!items.length && !addItems.length && !STATE.editMode){
        var empty = document.createElement('div');
        empty.className = 'cell-empty';
        empty.textContent = '休診';
        cell.appendChild(empty);
      }

      if (STATE.editMode){
        var btn=document.createElement('button'); btn.type='button'; btn.className='add-btn';
        btn.textContent='＋ 新增排班';
        (function(d, ses){
          btn.addEventListener('click', function(){ openSlotModal(null, d, ses); });
        })(dateStr, session);
        cell.appendChild(btn);
      }
      grid.appendChild(cell);
    }
  }
}

function timeBlock(start, end){
  return '<div class="time-block">'
       +   '<div>'+(start||'')+'</div>'
       +   '<div class="tilde">~</div>'
       +   '<div>'+(end||'')+'</div>'
       + '</div>';
}
function makeSlot(it, exc){
  var div=document.createElement('div'); div.className='slot';
  var name = it.doctor;
  var s = it.start, e = it.end;
  var tag = '';
  if (exc){
    if (exc.type==='請假'){ div.classList.add('exc-leave'); tag='<div class="tag">請假</div>'; }
    else if (exc.type==='取消'){ div.classList.add('exc-cancel'); tag='<div class="tag">取消</div>'; }
    else if (exc.type==='代班' && exc.subDoctor){
      div.classList.add('exc-sub');
      name = exc.subDoctor + '<div class="tag">代 '+it.doctor+'</div>';
      if (exc.start && exc.end) { s = exc.start; e = exc.end; }
    }
  }
  div.innerHTML = '<div class="name">'+name+'</div>'+timeBlock(s, e)+tag;
  if (STATE.editMode){
    div.classList.add('editable');
    div.addEventListener('click', function(){ openSlotModal(it); });
  }
  return div;
}
function makeExcOnlySlot(e){
  var div=document.createElement('div'); div.className='slot exc-sub';
  var name = (e.subDoctor||e.origDoctor||'加診') + '<div class="tag">加診</div>';
  div.innerHTML = '<div class="name">'+name+'</div>'+timeBlock(e.start, e.end);
  return div;
}

/* ===================== 排班 Modal ===================== */
function openSlotModal(it, date, session){
  if (!STATE.user || STATE.user.role!=='admin'){ toast('需要管理者登入','err'); return; }
  EDIT_SLOT = it ? Object.assign({}, it) : null;
  $('slot-title').textContent = it ? '編輯排班' : '新增排班';
  $('slot-date').value    = it ? it.date    : (date || todayStr());
  $('slot-session').value = it ? it.session : (session||'早診');
  $('slot-doctor').value  = it ? it.doctor  : (STATE.doctors[0]||'');
  $('slot-start').value   = it ? it.start   : '';
  $('slot-end').value     = it ? it.end     : '';
  $('slot-sort').value    = it ? (it.sort||1) : 1;
  $('slot-note').value    = it ? (it.note||'') : '';
  $('slot-service').value = it ? (it.service||STATE.service) : STATE.service;
  $('btn-slot-del').classList.toggle('hide', !it);
  updateSlotHoursInfo();
  show('mask-slot');
}
function updateSlotHoursInfo(){
  var s=$('slot-start').value, e=$('slot-end').value;
  var info=$('slot-hours-info');
  if (s && e && s < e) {
    var h = ((parseInt(e.slice(0,2))*60+parseInt(e.slice(3,5))) - (parseInt(s.slice(0,2))*60+parseInt(s.slice(3,5))))/60;
    info.textContent = '時數：' + (Math.round(h*100)/100) + ' 小時';
  } else { info.textContent = '時數：—'; }
}

function saveSlot(){
  var p = {
    action:'saveSlot',
    operator: STATE.user ? STATE.user.name : '',
    clinic: STATE.clinic,
    id: EDIT_SLOT ? EDIT_SLOT.id : '',
    date:    $('slot-date').value,
    session: $('slot-session').value,
    doctor:  $('slot-doctor').value,
    start:   $('slot-start').value,
    end:     $('slot-end').value,
    sort:    $('slot-sort').value || 1,
    note:    $('slot-note').value || '',
    service: $('slot-service').value || STATE.service
  };
  if(!p.date){ toast('請選擇日期','err'); return; }
  if(!p.start || !p.end){ toast('請填寫起訖時間','err'); return; }

function setHoursDateRange(which){
  var now = new Date();
  if (which==='last') now.setMonth(now.getMonth()-1);
  var y=now.getFullYear(), m=now.getMonth();
  var first = new Date(y, m, 1);
  var last  = new Date(y, m+1, 0);
  var pad=function(n){return String(n).padStart(2,'0')};
  $('hours-from').value = first.getFullYear()+'-'+pad(first.getMonth()+1)+'-'+pad(first.getDate());
  $('hours-to').value   = last.getFullYear() +'-'+pad(last.getMonth()+1) +'-'+pad(last.getDate());
}
function fillHoursClinicSel(){
  var sel = $('hours-clinic'); if (!sel) return;
  // 清掉舊的（保留第一個「全部院區」）
  while (sel.options.length > 1) sel.remove(1);
  STATE.clinics.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.code; o.textContent = c.name;
    sel.appendChild(o);
  });
  // 預設選「全部院區」
  sel.value = 'all';
}

function loadHours(){
  var f=$('hours-from').value, t=$('hours-to').value;
  var svc = $('hours-service').value;
  var cli = $('hours-clinic').value || 'all';
  if (!f || !t){ toast('請選擇期間','err'); return; }
  if (f > t){ toast('起日不可晚於迄日','err'); return; }
  $('hours-summary').innerHTML='<div style="text-align:center;color:var(--muted);padding:14px">查詢中...</div>';
  $('hours-table').innerHTML='';
  get({action:'getHoursReport', clinic:cli, service:svc, from:f, to:t}, function(r){

      $('hours-summary').innerHTML='<div style="color:var(--warn);padding:14px">'+r.error+'</div>';

function renderHours(r){

    var cc = STATE.clinics.find(function(c){return c.code===r.clinic;});

  sum.innerHTML = '<div class="hours-summary-pill">'+

    '<span>醫師人次：<b>'+r.rows.length+'</b></span>'+

      +'<span class="total">'+row.totalHours+' <small>小時</small></span>'
      +'</div>';

function exportHoursCSV(){
  var r = STATE.hoursReport;
  if (!r || !r.rows || !r.rows.length){ toast('請先查詢','err'); return; }
  var lines = ['醫師,日期,星期,院區,門診類型,時段,起始,結束,時數,備註'];
  r.rows.forEach(function(row){
    row.details.forEach(function(d){
      var cc = STATE.clinics.find(function(c){return c.code===d.clinic;});
      var clinicName = cc ? cc.name : (d.clinic||'');
      var fields = [row.doctor, d.date, WEEK[(d.weekday||1)-1],
                    clinicName, d.service||'', d.session,
                    d.start||'', d.end||'', d.hours||0, (d.note||'').replace(/"/g,'""')];
      lines.push(fields.map(function(x){
        var s=String(x);
        return /[,"\n]/.test(s) ? '"'+s+'"' : s;
      }).join(','));
    });
  });
  // 醫師總計
  lines.push('');
  lines.push('醫師,工作天數,總時數');
  r.rows.forEach(function(row){
    lines.push(row.doctor+','+row.days+','+row.totalHours);
  });
  var bom = '﻿';
  var blob = new Blob([bom + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '工時報表-'+r.from+'_'+r.to+'.csv';
  a.click();
}

    box.innerHTML='';
    if (!r.rows || !r.rows.length){
      box.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">沒有歷史紀錄</div>'; return;
    }
    r.rows.forEach(function(h){
      var d=document.createElement('div'); d.className='hist-row';
      var pre = h.before ? '<span class="pre">'+escapeHtml(h.before)+'</span>' : '';
      var post= h.after  ? '<span class="post">'+escapeHtml(h.after)+'</span>'   : '';
      var arrow = (h.before && h.after) ? ' → ' : '';
      d.innerHTML = '<span class="time">'+h.time+'</span>'
                  + '<span class="op">'+(h.operator||'-')+'</span>'
                  + '['+(h.action||'')+'] '+(h.type||'')+' '+(h.id||'')+'<br>'
                  + pre + arrow + post + (h.note?'　<i style="color:var(--muted)">('+h.note+')</i>':'');
      box.appendChild(d);
    });
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

/* ===================== 匯出（A4 橫式：29.7×21cm）===================== */
function captureNode(){ return document.getElementById('print-frame'); }
function captureFilename(ext){
  var name = (STATE.clinics.find(function(c){return c.code===STATE.clinic;})||{}).name || STATE.clinic;
  return '班表-'+name+'-'+STATE.service+'-'+todayStr()+'.'+ext;
}
function withCaptureMode(cb){
  document.body.classList.add('exporting');
  // 等樣式套用後再截圖
  setTimeout(function(){
    cb(function(){ document.body.classList.remove('exporting'); });
  }, 100);
}

// html2canvas 共用設定（高解析度、A4 比例、保留漸層）
function captureOptions(node){
  return {
    scale: 2.5,                       // 1240×880 × 2.5 ≈ 3100×2200，接近 A4@200dpi
    backgroundColor: null,            // 透明，讓 print-frame 自身漸層完整呈現
    useCORS: true,
    allowTaint: false,
    logging: false,
    width:  node.offsetWidth,
    height: node.offsetHeight,
    windowWidth:  Math.max(1280, document.documentElement.clientWidth),
    windowHeight: Math.max(900,  document.documentElement.clientHeight)
  };
}

function exportPNG(){
  var node = captureNode();
  if (!node || !window.html2canvas){ toast('匯出工具尚未載入','err'); return; }
  toast('產生 PNG 中…','ok');
  withCaptureMode(function(done){
    html2canvas(node, captureOptions(node)).then(function(canvas){
      done();
      // 縮放到 A4@200DPI 標準大小（2339×1654），保證精準的 A4 橫式
      var a4 = document.createElement('canvas');
      a4.width = 2339; a4.height = 1654;
      var ctx = a4.getContext('2d');
      // 白色底（避免 transparent 被某些檢視器視為黑）
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, a4.width, a4.height);
      ctx.drawImage(canvas, 0, 0, a4.width, a4.height);
      var a=document.createElement('a');
      a.href=a4.toDataURL('image/png');
      a.download=captureFilename('png');
      a.click();
    }).catch(function(e){ done(); toast('匯出失敗：'+e,'err'); });
  });
}

function exportPDF(){
  var node = captureNode();
  if (!node || !window.html2canvas || !window.jspdf){ toast('匯出工具尚未載入','err'); return; }
  toast('產生 PDF 中…','ok');
  withCaptureMode(function(done){
    html2canvas(node, captureOptions(node)).then(function(canvas){
      done();
      var imgData = canvas.toDataURL('image/png');
      // 直接產生 A4 橫式，圖片填滿整頁（無邊距），最完美的 A4 輸出
      var pdf = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
      pdf.save(captureFilename('pdf'));
    }).catch(function(e){ done(); toast('匯出失敗：'+e,'err'); });
  });
}

/* ===================== 標題持久化（依 院區+類型 各自記憶）===================== */
function titleKey(){ return STATE.clinic + '|' + STATE.service; }

function defaultTitle(){
  var c = STATE.clinics.find(function(x){return x.code===STATE.clinic;});
  var name = c ? c.name : STATE.clinic;
  var short = String(name).replace(/院區$/, '');
  return short + STATE.service;   // 例如「鶯歌健保門診」、「桃園減重門診」
}

function loadAllTitles(){
  try { return JSON.parse(localStorage.getItem('schedule_print_titles')||'{}'); }
  catch(e){ return {}; }
}

function saveTitleFor(key, text){
  var all = loadAllTitles();
  all[key] = text;
  try{ localStorage.setItem('schedule_print_titles', JSON.stringify(all)); }catch(e){}
}

function refreshTitle(){
  var t = $('print-title'); if (!t) return;
  var all = loadAllTitles();
  t.textContent = all[titleKey()] || defaultTitle();
}

function bindTitlePersist(){
  var t = $('print-title'); if (!t) return;
  // 一次性遷移：把舊版單一 key (schedule_print_title) 移到鶯歌健保下
  try{
    var legacy = localStorage.getItem('schedule_print_title');
    if (legacy && !localStorage.getItem('schedule_print_titles')){
      saveTitleFor('yingge|健保門診', legacy);
      localStorage.removeItem('schedule_print_title');
    }
  }catch(e){}
  t.addEventListener('input', function(){
    saveTitleFor(titleKey(), t.textContent.trim());
  });
}

/* ===================== 啟動 ===================== */
init();
</script>
